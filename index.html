<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0,
                   maximum-scale=1.0, user-scalable=no">

    <title></title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Helvetica Neue",
                Arial,
                sans-serif;

            background:
                linear-gradient(
                    rgba(48, 50, 76, 0.86),
                    rgba(25, 27, 43, 0.94)
                ),
                url("./IMG_8622.jpeg")
                center center /
                cover no-repeat fixed;

            display: flex;
            justify-content: center;

            overflow-x: hidden;
            color: #222;
        }

        .overlay {
            position: fixed;
            inset: 0;

            background:
                linear-gradient(
                    rgba(35, 38, 61, 0.20),
                    rgba(12, 14, 25, 0.30)
                );

            pointer-events: none;
            z-index: 0;
        }

        .container {
            width: 100%;
            max-width: 720px;

            padding-top: 58px;

            text-align: center;

            position: relative;
            z-index: 1;
        }

        /* =========================
           TÊN PHÍA TRÊN
        ========================= */

        .user-info {
            margin: 0 20px 48px;

            font-size: 26px;
            line-height: 1.3;

            font-weight: 600;

            color: #f0d69a;

            letter-spacing: 0.2px;

            text-shadow:
                0 2px 4px rgba(0, 0, 0, 0.95),
                0 0 10px rgba(0, 0, 0, 0.65);
        }

        /* =========================
           KHUNG DEMO
        ========================= */

        .qr-card {
            position: relative;

            margin: 0 24px;

            background: #ffffff;

            border-radius: 13px;

            overflow: hidden;

            box-shadow:
                0 15px 35px rgba(0, 0, 0, 0.42);
        }

        /* =========================
           PHẦN VÀNG
        ========================= */

        .qr-header {
            height: 155px;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;

            background: #f5c542;

            color: #ffffff;

            font-size: 26px;
            font-weight: 400;

            line-height: 1.4;
        }

        /* =========================
           LỖ KHUYẾT
        ========================= */

        .notch {
            position: absolute;

            width: 28px;
            height: 28px;

            top: 141px;

            background: #303249;

            border-radius: 50%;

            z-index: 5;
        }

        .notch-left {
            left: -14px;
        }

        .notch-right {
            right: -14px;
        }

        /* =========================
           PHẦN TRẮNG
        ========================= */

        .qr-body {
            padding:
                29px
                20px
                34px;

            color: #222;
        }

        #current-time {
            margin-bottom: 18px;

            font-size: 25px;

            font-weight: 600;

            color: #151a2c;

            letter-spacing: -0.5px;
        }

        /*
         * QR DEMO
         * Không dùng làm mã ra/vào thực tế.
         */

        .qr-demo {
            width: 78%;
            max-width: 500px;

            aspect-ratio: 1 / 1;

            margin: 0 auto;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                repeating-linear-gradient(
                    0deg,
                    #111 0px,
                    #111 7px,
                    #fff 7px,
                    #fff 14px
                );

            border: 12px solid #fff;

            overflow: hidden;
        }

        .qr-demo-text {
            width: 72%;
            height: 72%;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #fff;

            color: #222;

            font-size: 18px;
            font-weight: 600;

            text-align: center;
        }

        /* =========================
           CHỮ "刷新二维码"
        ========================= */

        .refresh-text {
            display: block;

            margin-top: 22px;

            font-size: 23px;

            color: #222;

            user-select: none;
        }

        /* =========================
           TRẠNG THÁI
        ========================= */

        .status-active {
            margin-top: 23px;

            font-size: 30px;

            font-weight: 600;

            color: #a9e8c7;
        }

        /* =========================
           TIMER
        ========================= */

        #timer-up {
            margin-top: 5px;

            font-size: 39px;

            line-height: 1.2;

            font-weight: 500;

            color: #20bd61;

            font-variant-numeric: tabular-nums;
        }

        /* =========================
           CHỮ PHÍA DƯỚI
        ========================= */

        .footer-note {
            margin:
                47px
                48px
                55px;

            font-size: 20px;

            line-height: 1.8;

            color: #e6d09d;

            text-align: left;

            text-shadow:
                0 2px 4px rgba(0, 0, 0, 0.95),
                0 0 8px rgba(0, 0, 0, 0.55);
        }

        /* =========================
           ĐIỆN THOẠI
        ========================= */

        @media (max-width: 600px) {

            .container {
                padding-top: 58px;
            }

            .user-info {
                font-size: 25px;
                margin-bottom: 46px;
            }

            .qr-card {
                margin: 0 15px;
                border-radius: 13px;
            }

            .qr-header {
                height: 155px;
                font-size: 25px;
            }

            .notch {
                top: 141px;
            }

            .qr-body {
                padding:
                    29px
                    15px
                    34px;
            }

            #current-time {
                font-size: 24px;
            }

            .qr-demo {
                width: 80%;
            }

            .refresh-text {
                font-size: 23px;
            }

            .status-active {
                font-size: 29px;
            }

            #timer-up {
                font-size: 39px;
            }

            .footer-note {
                margin:
                    47px
                    40px
                    55px;

                font-size: 19px;

                line-height: 1.8;
            }
        }

        @media (max-width: 390px) {

            .user-info {
                font-size: 22px;
            }

            .qr-header {
                font-size: 22px;
            }

            #current-time {
                font-size: 21px;
            }

            .footer-note {
                margin-left: 35px;
                margin-right: 35px;

                font-size: 18px;
            }
        }
    </style>
</head>

<body>

<div class="overlay"></div>

<div class="container">

    <!-- TÊN -->
    <div class="user-info">
        V25102128(Mong Tien Nhieu)
    </div>

    <!-- KHUNG -->
    <div class="qr-card">

        <!-- HEADER VÀNG -->
        <div class="qr-header">
            将二维码对准扫描器刷码出场
        </div>

        <!-- LỖ KHUYẾT -->
        <div class="notch notch-left"></div>
        <div class="notch notch-right"></div>

        <!-- BODY -->
        <div class="qr-body">

            <!-- THỜI GIAN -->
            <div id="current-time"></div>

            <!-- QR DEMO -->
            <div class="qr-demo">
                <div class="qr-demo-text">
                    QR DEMO
                </div>
            </div>

            <!-- CHỮ -->
            <span class="refresh-text">
                刷新二维码
            </span>

            <div class="status-active">
                已生效
            </div>

            <!-- TIMER -->
            <div id="timer-up">
                00:00
            </div>

        </div>
    </div>

    <!-- CHỮ BÊN NGOÀI -->
    <div class="footer-note">
        尊敬的员工您好，您已进入企业涉密区域，出于企业安全考虑，您的手机摄像头将被禁止拍摄，感谢您的配合。
    </div>

</div>

<script>

    /* =========================
       ĐỒNG HỒ HIỆN TẠI
    ========================= */

    function updateClock() {

        const now = new Date();

        const year = now.getFullYear();

        const month =
            String(now.getMonth() + 1)
            .padStart(2, "0");

        const day =
            String(now.getDate())
            .padStart(2, "0");

        const hours =
            String(now.getHours())
            .padStart(2, "0");

        const minutes =
            String(now.getMinutes())
            .padStart(2, "0");

        const seconds =
            String(now.getSeconds())
            .padStart(2, "0");

        document
            .getElementById("current-time")
            .textContent =
            `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;
    }


    /* =========================
       TIMER DEMO
       00:00 → 11:59:59 → 00:00
    ========================= */

    let startTime = Date.now();

    const TWELVE_HOURS =
        12 * 60 * 60 * 1000;


    function updateTimer() {

        const now = Date.now();

        let elapsed =
            now - startTime;


        if (elapsed >= TWELVE_HOURS) {

            startTime = now;

            elapsed = 0;
        }


        const totalSeconds =
            Math.floor(elapsed / 1000);


        const hours =
            Math.floor(
                totalSeconds / 3600
            );

        const minutes =
            Math.floor(
                (totalSeconds % 3600) / 60
            );

        const seconds =
            totalSeconds % 60;


        let display;


        if (hours === 0) {

            /*
             * 00:00
             * 18:20
             */

            display =
                `${String(minutes).padStart(2, "0")}:` +
                `${String(seconds).padStart(2, "0")}`;

        } else {

            /*
             * 1:00:00
             * 1:18:20
             */

            display =
                `${hours}:` +
                `${String(minutes).padStart(2, "0")}:` +
                `${String(seconds).padStart(2, "0")}`;
        }


        document
            .getElementById("timer-up")
            .textContent = display;
    }


    /* =========================
       KHỞI ĐỘNG
    ========================= */

    updateClock();
    updateTimer();


    setInterval(
        updateClock,
        1000
    );


    setInterval(
        updateTimer,
        1000
    );

</script>

</body>
</html>
