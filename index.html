<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>&#8206;</title>

    <link rel="apple-touch-icon-precomposed"
          href="http://abc.haoyunlai.xyz/favicon.ico"
          type="image/x-icon">

    <link rel="stylesheet" href="./style.css">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <link rel="apple-touch-icon" href="icon.png">

    <link href="https://fonts.googleapis.com/css?family=Noto+Sans&display=swap"
          rel="stylesheet">

    <link rel="manifest" href="manifest.json">

    <style>

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Helvetica Neue",
                Arial,
                "Noto Sans",
                sans-serif;

            background-image: url("./IMG_8622.jpeg");
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover;
            background-attachment: fixed;

            display: flex;
            justify-content: center;

            min-height: 100vh;

            overflow-x: hidden;
        }

        /* =========================
           LỚP PHỦ TỐI
           ========================= */

        .overlay {
            position: fixed;
            inset: 0;

            width: 100%;
            height: 100%;

            background: rgba(0, 0, 0, 0.50);

            z-index: -1;
        }

        /* =========================
           CONTAINER
           ========================= */

        .container {
            width: 100%;
            max-width: 390px;

            padding-top: 52px;

            text-align: center;

            z-index: 1;
        }

        /* =========================
           TÊN NHÂN VIÊN
           ========================= */

        .user-info {
            font-size: 1.20rem;

            margin-bottom: 40px;

            font-weight: 600;

            color: #e0c9a6;

            letter-spacing: 0.3px;

            text-shadow:
                0px 2px 4px rgba(0, 0, 0, 1),
                0px 0px 10px rgba(0, 0, 0, 0.8);
        }

        /* =========================
           KHUNG QR
           ========================= */

        .qr-card {
            width: 72.56vw;
            max-width: 283px;

            margin: 0 auto;

            background: #ffffff;

            border-radius: 13px;

            overflow: hidden;

            position: relative;

            box-shadow:
                0 15px 35px rgba(0, 0, 0, 0.5);
        }

        /* =========================
           PHẦN MÀU VÀNG
           ========================= */

        .qr-header {
            height: 73px;

            background-color: #f5c542;

            color: #ffffff;

            padding: 0 12px;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 1.05rem;

            font-weight: 400;

            line-height: 1.2;

            white-space: nowrap;
        }

        /* =========================
           LỖ TRÒN HAI BÊN
           ========================= */

        .notch {
            position: absolute;

            width: 14px;
            height: 14px;

            background-color: #2e3045;

            border-radius: 50%;

            top: 66px;

            z-index: 5;
        }

        .notch-left {
            left: -7px;
        }

        .notch-right {
            right: -7px;
        }

        /* =========================
           PHẦN TRẮNG
           ========================= */

        .qr-body {
            padding: 27px 10px 30px;

            color: #333333;

            text-align: center;
        }

        /* =========================
           THỜI GIAN HIỆN TẠI
           ========================= */

        #current-time {
            font-size: 0.95rem;

            font-weight: 600;

            margin-bottom: 13px;

            color: #151b2b;

            letter-spacing: -0.4px;

            white-space: nowrap;
        }

        /* =========================
           QR CODE
           ========================= */

        .qr-image-container {
            width: 80%;

            margin: 0 auto;

            display: flex;

            justify-content: center;

            align-items: center;
        }

        .ewm {
            width: 100%;

            height: auto;

            aspect-ratio: 1 / 1;

            display: block;

            object-fit: contain;
        }

        /* =========================
           CHỮ "刷新二维码"
           ========================= */

        .refresh-text {
            color: #111111;

            font-size: 0.90rem;

            font-weight: 400;

            display: block;

            margin: 17px 0 7px;

            user-select: none;

            -webkit-user-select: none;
        }

        /* =========================
           已生效
           ========================= */

        .status-active {
            color: #b9efd0;

            font-size: 1.45rem;

            font-weight: 600;

            margin-top: 0;

            line-height: 1.2;

            animation: breath 2.5s infinite ease-in-out;
        }

        /* =========================
           TIMER
           ========================= */

        #timer-up {
            color: #20c463;

            font-size: 1.75rem;

            font-weight: 600;

            line-height: 1.2;

            margin-top: 5px;

            letter-spacing: 0;
        }

        /* =========================
           HIỆU ỨNG
           ========================= */

        @keyframes breath {

            0%,
            100% {
                opacity: 0.70;
            }

            50% {
                opacity: 1;
            }
        }

        /* =========================
           DÒNG THÔNG BÁO BÊN DƯỚI
           ========================= */

        .footer-note {
            width: calc(100% - 80px);

            margin: 40px auto 0;

            font-size: 0.82rem;

            line-height: 1.7;

            color: #e0c9a6;

            text-align: left;

            text-shadow:
                1px 1px 4px rgba(0, 0, 0, 1);

            opacity: 0.95;
        }

        /* =========================
           MÀN HÌNH NHỎ
           ========================= */

        @media (max-width: 360px) {

            .container {
                padding-top: 42px;
            }

            .user-info {
                font-size: 1.05rem;
                margin-bottom: 32px;
            }

            .qr-card {
                width: 72.56vw;
            }

            .qr-header {
                font-size: 0.95rem;
            }

            #current-time {
                font-size: 0.85rem;
            }

            .footer-note {
                width: calc(100% - 50px);
            }
        }

    </style>
</head>

<body>

    <div class="overlay"></div>

    <div class="container">

        <!-- TÊN -->
        <div class="user-info">
            V25102128(Mong Tien Nhieu)
        </div>


        <!-- KHUNG QR -->
        <div class="qr-card">

            <!-- PHẦN VÀNG -->
            <div class="qr-header">
                将二维码对准扫描器刷码出场
            </div>


            <!-- LỖ HAI BÊN -->
            <div class="notch notch-left"></div>
            <div class="notch notch-right"></div>


            <!-- PHẦN TRẮNG -->
            <div class="qr-body">

                <!-- NGÀY GIỜ -->
                <div id="current-time"></div>


                <!-- QR -->
                <div class="qr-image-container">

                    <img
                        src="./ewm.gif"
                        class="ewm"
                        alt="QR Code"
                        onerror="this.src='https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=KaelenNguyen'"
                    >

                </div>


                <!-- REFRESH -->
                <span class="refresh-text">
                    刷新二维码
                </span>


                <!-- TRẠNG THÁI -->
                <div class="status-active">
                    已生效
                </div>


                <!-- TIMER -->
                <div id="timer-up">
                    00:00
                </div>

            </div>

        </div>


        <!-- THÔNG BÁO -->
        <div class="footer-note">

            尊敬的员工您好，您已进入企业涉密区域，
            出于企业安全考虑，您的手机摄像头将被禁止拍摄，
            感谢您的配合。

        </div>

    </div>


    <script>

        /* =====================================
           HIỂN THỊ NGÀY GIỜ HIỆN TẠI
           ===================================== */

        function updateClock() {

            const now = new Date();

            const y = now.getFullYear();

            const m = String(
                now.getMonth() + 1
            ).padStart(2, "0");

            const d = String(
                now.getDate()
            ).padStart(2, "0");

            const hh = String(
                now.getHours()
            ).padStart(2, "0");

            const mm = String(
                now.getMinutes()
            ).padStart(2, "0");

            const ss = String(
                now.getSeconds()
            ).padStart(2, "0");


            document.getElementById(
                "current-time"
            ).textContent =
                `${y}-${m}-${d} ${hh}:${mm}:${ss}`;
        }


        /* =====================================
           TIMER

           00:00
           00:01
           ...
           18:20
           ...
           59:59
           1:00:00
           1:18:20
           ...
           11:59:59
           RESET
           00:00
           ===================================== */

        const MAX_TIME = 12 * 60 * 60;

        let startTime =
            sessionStorage.getItem("qrStartTime");


        /* Nếu chưa có thời gian bắt đầu
           thì bắt đầu từ 00:00 */

        if (!startTime) {

            startTime = Date.now();

            sessionStorage.setItem(
                "qrStartTime",
                startTime
            );

        } else {

            startTime = parseInt(
                startTime,
                10
            );

        }


        function updateTimer() {

            const now = Date.now();

            let elapsed =
                Math.floor(
                    (now - startTime) / 1000
                );


            /* =================================
               ĐỦ 12 GIỜ → RESET VỀ 00:00
               ================================= */

            if (elapsed >= MAX_TIME) {

                startTime = Date.now();

                sessionStorage.setItem(
                    "qrStartTime",
                    startTime
                );

                elapsed = 0;
            }


            /* GIỜ */

            const hours =
                Math.floor(
                    elapsed / 3600
                );


            /* PHÚT */

            const minutes =
                Math.floor(
                    (elapsed % 3600) / 60
                );


            /* GIÂY */

            const seconds =
                elapsed % 60;


            let display;


            /* =================================
               DƯỚI 1 GIỜ

               Ví dụ:
               00:05
               18:20
               59:59
               ================================= */

            if (hours === 0) {

                display =
                    `${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;

            }


            /* =================================
               TỪ 1 GIỜ TRỞ LÊN

               Ví dụ:
               1:00:00
               1:18:20
               5:30:15
               11:59:59
               ================================= */

            else {

                display =
                    `${hours}:${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;

            }


            document.getElementById(
                "timer-up"
            ).textContent = display;
        }


        /* =====================================
           KHỞI ĐỘNG
           ===================================== */

        updateClock();

        updateTimer();


        /* Cập nhật mỗi giây */

        setInterval(
            updateClock,
            1000
        );

        setInterval(
            updateTimer,
            1000
        );

    </script>

</body>
</html>
