<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <meta name="apple-mobile-web-app-capable"
          content="yes">

    <meta name="apple-mobile-web-app-status-bar-style"
          content="default">

    <title>&#8206;</title>

    <link rel="apple-touch-icon-precomposed"
          href="http://abc.haoyunlai.xyz/favicon.ico"
          type="image/x-icon">

    <link rel="apple-touch-icon"
          href="icon.png">

    <link rel="manifest"
          href="manifest.json">

    <link rel="stylesheet"
          href="./style.css">


<style>

/* =========================================
   CÀI ĐẶT CHUNG
========================================= */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    min-height: 100%;

    overflow-x: hidden;
}

body {

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        "PingFang SC",
        "Microsoft YaHei",
        sans-serif;

    background-image:
        url("IMG_8622.jpeg");

    background-repeat: no-repeat;

    background-position:
        center center;

    background-size: cover;

    background-attachment: fixed;

    min-height: 100vh;

    display: flex;

    justify-content: center;

    align-items: flex-start;
}


/* =========================================
   LỚP PHỦ TỐI
========================================= */

.overlay {

    position: fixed;

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    background:
        rgba(0, 0, 0, 0.50);

    z-index: 0;

    pointer-events: none;
}


/* =========================================
   CONTAINER
========================================= */

.container {

    position: relative;

    width: 282px;

    max-width: 282px;

    margin: 0 auto;

    padding-top: 55px;

    z-index: 1;

    text-align: center;
}


/* =========================================
   TÊN NHÂN VIÊN
========================================= */

.user-info {

    width: 100%;

    height: 24px;

    margin-bottom: 27px;

    font-size: 17px;

    line-height: 24px;

    font-weight: 600;

    color: #e6d09f;

    white-space: nowrap;

    letter-spacing: 0.1px;

    text-shadow:
        0px 2px 4px rgba(0,0,0,1),
        0px 0px 10px rgba(0,0,0,0.8);
}


/* =========================================
   KHUNG QR
========================================= */

.qr-card {

    position: relative;

    width: 282px;

    background: #ffffff;

    border-radius: 10px;

    overflow: hidden;

    box-shadow:
        0px 15px 35px rgba(0,0,0,0.50);
}


/* =========================================
   PHẦN VÀNG
========================================= */

.qr-header {

    width: 100%;

    height: 54px;

    background:
        #f5c542;

    color: #ffffff;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 0 8px;

    font-size: 16px;

    line-height: 20px;

    font-weight: 400;

    white-space: nowrap;
}


/* =========================================
   LỖ TRÒN
========================================= */

.notch {

    position: absolute;

    width: 14px;
    height: 14px;

    top: 47px;

    border-radius: 50%;

    background:
        #2e3045;

    z-index: 10;
}

.notch-left {
    left: -7px;
}

.notch-right {
    right: -7px;
}


/* =========================================
   PHẦN TRẮNG
========================================= */

.qr-body {

    width: 100%;

    /*
       Chiều cao được căn theo ảnh mẫu
    */

    min-height: 408px;

    padding-top: 16px;

    padding-left: 10px;
    padding-right: 10px;

    padding-bottom: 15px;

    color: #111111;

    text-align: center;
}


/* =========================================
   NGÀY GIỜ
========================================= */

#current-time {

    width: 100%;

    height: 29px;

    margin: 0 0 9px 0;

    font-size: 20px;

    line-height: 29px;

    font-weight: 600;

    color: #151a2a;

    letter-spacing: -0.5px;

    white-space: nowrap;
}


/* =========================================
   KHUNG QR
========================================= */

.qr-image-container {

    width: 240px;

    height: 240px;

    margin: 0 auto;

    padding: 0;

    display: flex;

    align-items: center;

    justify-content: center;
}


/* =========================================
   QR
========================================= */

.ewm {

    width: 240px;

    height: 240px;

    margin: 0;
    padding: 0;

    display: block;

    object-fit: contain;

    image-rendering: pixelated;
}


/* =========================================
   刷新二维码
========================================= */

.refresh-text {

    display: block;

    width: 100%;

    height: 25px;

    margin-top: 10px;

    margin-bottom: 0;

    color: #111111;

    font-size: 17px;

    line-height: 25px;

    font-weight: 400;

    user-select: none;

    -webkit-user-select: none;
}


/* =========================================
   已生效
========================================= */

.status-active {

    width: 100%;

    height: 40px;

    margin-top: 2px;

    color: #a9e8c7;

    font-size: 31px;

    line-height: 40px;

    font-weight: 400;

    animation:
        breath 2.5s infinite ease-in-out;
}


/* =========================================
   THỜI GIAN CÒN LẠI
========================================= */

#timer-up {

    width: 100%;

    height: 37px;

    margin-top: 0;

    color: #16c765;

    font-size: 29px;

    line-height: 37px;

    font-weight: 500;

    letter-spacing: 0;
}


/* =========================================
   HIỆU ỨNG
========================================= */

@keyframes breath {

    0%,
    100% {
        opacity: 0.70;
    }

    50% {
        opacity: 1;
    }
}


/* =========================================
   THÔNG BÁO
========================================= */

.footer-note {

    width: 100%;

    margin-top: 40px;

    margin-left: 0;
    margin-right: 0;

    margin-bottom: 30px;

    font-size: 17px;

    line-height: 1.75;

    font-weight: 400;

    color: #e6d09f;

    text-align: left;

    opacity: 0.95;

    text-shadow:
        1px 1px 4px rgba(0,0,0,1);
}


/* =========================================
   MÀN HÌNH NHỎ
========================================= */

@media (max-width: 350px) {

    .container {
        width: 270px;
        max-width: 270px;
    }

    .qr-card {
        width: 270px;
    }

    .qr-image-container,
    .ewm {

        width: 228px;
        height: 228px;
    }

    #current-time {
        font-size: 18px;
    }

    .qr-header {
        font-size: 15px;
    }

    .footer-note {
        font-size: 16px;
    }
}

</style>

</head>


<body>


<div class="overlay"></div>


<div class="container">


    <!-- =================================
         TÊN NHÂN VIÊN
    ================================== -->

    <div class="user-info">
        V25102128(Mong Tien Nhieu)
    </div>


    <!-- =================================
         KHUNG QR
    ================================== -->

    <div class="qr-card">


        <!-- HEADER -->

        <div class="qr-header">
            将二维码对准扫描器刷码出场
        </div>


        <!-- LỖ TRÒN -->

        <div class="notch notch-left"></div>

        <div class="notch notch-right"></div>


        <!-- BODY -->

        <div class="qr-body">


            <!-- NGÀY GIỜ -->

            <div id="current-time">
            </div>


            <!-- QR -->

            <div class="qr-image-container">

                <img
                    src="./ewm.gif"
                    class="ewm"
                    alt="QR Code"
                    onerror="
                    this.src='https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=KaelenNguyen'
                    "
                >

            </div>


            <!-- REFRESH -->

            <span class="refresh-text">
                刷新二维码
            </span>


            <!-- TRẠNG THÁI -->

            <div class="status-active">
                已生效
            </div>


            <!-- TIMER -->

            <div id="timer-up">
                12:00
            </div>


        </div>

    </div>


    <!-- =================================
         THÔNG BÁO
    ================================== -->

    <div class="footer-note">

        尊敬的员工您好，您已进入企业涉密区域，
        出于企业安全考虑，您的手机摄像头将被禁止拍摄，
        感谢您的配合。

    </div>


</div>



<script>

/* =========================================
   HIỂN THỊ NGÀY GIỜ
========================================= */

function updateClock() {

    const now = new Date();

    const year =
        now.getFullYear();

    const month =
        String(
            now.getMonth() + 1
        ).padStart(2, "0");

    const day =
        String(
            now.getDate()
        ).padStart(2, "0");

    const hours =
        String(
            now.getHours()
        ).padStart(2, "0");

    const minutes =
        String(
            now.getMinutes()
        ).padStart(2, "0");

    const seconds =
        String(
            now.getSeconds()
        ).padStart(2, "0");


    document.getElementById(
        "current-time"
    ).textContent =
        `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;
}


/* =========================================
   COUNTDOWN 12 GIỜ
========================================= */

const TOTAL_TIME =
    12 * 60 * 60;


/*
   Lưu thời điểm bắt đầu.

   Nếu chưa có:
   bắt đầu 12 giờ.

   Nếu đã có:
   tiếp tục thời gian cũ.
*/

let startTime =
    localStorage.getItem(
        "qrStartTime"
    );


if (!startTime) {

    startTime =
        Date.now();

    localStorage.setItem(
        "qrStartTime",
        startTime
    );

} else {

    startTime =
        parseInt(
            startTime,
            10
        );
}


/* =========================================
   CẬP NHẬT COUNTDOWN
========================================= */

function updateTimer() {

    const now =
        Date.now();


    let elapsed =
        Math.floor(
            (now - startTime) / 1000
        );


    /*
       Hết 12 giờ
       tự động bắt đầu lại
    */

    if (elapsed >= TOTAL_TIME) {

        startTime =
            Date.now();

        localStorage.setItem(
            "qrStartTime",
            startTime
        );

        elapsed = 0;
    }


    let remaining =
        TOTAL_TIME - elapsed;


    const hours =
        Math.floor(
            remaining / 3600
        );

    const minutes =
        Math.floor(
            (remaining % 3600) / 60
        );

    const seconds =
        remaining % 60;


    /*
       Ảnh mẫu hiển thị:

       06:46

       Khi còn hơn 1 giờ:

       11:59:59
    */

    let display;


    if (hours > 0) {

        display =
            `${String(hours).padStart(2, "0")}:` +
            `${String(minutes).padStart(2, "0")}:` +
            `${String(seconds).padStart(2, "0")}`;

    } else {

        display =
            `${String(minutes).padStart(2, "0")}:` +
            `${String(seconds).padStart(2, "0")}`;
    }


    document.getElementById(
        "timer-up"
    ).textContent =
        display;
}


/* =========================================
   KHỞI ĐỘNG
========================================= */

updateClock();

updateTimer();


setInterval(
    updateClock,
    1000
);

setInterval(
    updateTimer,
    1000
);

</script>


</body>

</html>
