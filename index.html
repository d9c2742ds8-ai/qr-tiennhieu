<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <meta name="apple-mobile-web-app-capable"
          content="yes">

    <meta name="apple-mobile-web-app-status-bar-style"
          content="default">

    <title>&#8206;</title>

    <link rel="stylesheet" href="./style.css">

    <link rel="apple-touch-icon"
          href="icon.png">

    <link rel="manifest"
          href="manifest.json">


    <style>

        /* =========================================
           CÀI ĐẶT CHUNG
        ========================================= */

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }

        body {

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Helvetica Neue",
                Arial,
                sans-serif;

            background:
                url("IMG_8622.jpeg")
                no-repeat
                center center
                fixed;

            background-size: cover;

            display: flex;

            justify-content: center;

            overflow-x: hidden;

            color: #222;
        }


        /* =========================================
           LỚP TỐI TRÊN ẢNH NỀN
        ========================================= */

        .overlay {

            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            background: rgba(0, 0, 0, 0.50);

            z-index: -1;
        }


        /* =========================================
           KHUNG CHÍNH
        ========================================= */

        .container {

            width: 100%;

            max-width: 720px;

            padding-top: 65px;

            text-align: center;
        }


        /* =========================================
           TÊN NHÂN VIÊN
        ========================================= */

        .user-info {

            font-size: 1.35rem;

            font-weight: 600;

            margin-bottom: 48px;

            color: #f0dca7;

            letter-spacing: 0.3px;

            text-shadow:
                0px 2px 4px rgba(0,0,0,1),
                0px 0px 10px rgba(0,0,0,0.8);
        }


        /* =========================================
           THẺ QR
        ========================================= */

        .qr-card {

            position: relative;

            background: #ffffff;

            border-radius: 13px;

            margin: 0 15px;

            overflow: hidden;

            box-shadow:
                0 15px 35px rgba(0,0,0,0.50);
        }


        /* =========================================
           PHẦN MÀU VÀNG
        ========================================= */

        .qr-header {

            background: #f5c542;

            color: #ffffff;

            min-height: 126px;

            padding:
                42px 15px
                35px 15px;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 1.20rem;

            font-weight: 400;

            line-height: 1.3;
        }


        /* =========================================
           LỖ TRÒN HAI BÊN
        ========================================= */

        .notch {

            position: absolute;

            width: 22px;
            height: 22px;

            top: 115px;

            background: #303248;

            border-radius: 50%;

            z-index: 5;
        }

        .notch-left {
            left: -11px;
        }

        .notch-right {
            right: -11px;
        }


        /* =========================================
           PHẦN TRẮNG
        ========================================= */

        .qr-body {

            background: #ffffff;

            padding:
                28px
                20px
                35px;

            color: #202433;
        }


        /* =========================================
           THỜI GIAN HIỆN TẠI
        ========================================= */

        #current-time {

            font-size: 1.45rem;

            font-weight: 600;

            margin-bottom: 18px;

            color: #202433;

            letter-spacing: 0;
        }


        /* =========================================
           KHUNG QR
        ========================================= */

        .qr-image-container {

            width: 86%;

            max-width: 560px;

            margin: 0 auto;
        }


        .ewm {

            width: 100%;

            height: auto;

            display: block;

            image-rendering: auto;
        }


        /* =========================================
           CHỮ "刷新二维码"
        ========================================= */

        .refresh-text {

            display: block;

            margin-top: 25px;

            margin-bottom: 13px;

            color: #111111;

            font-size: 1.20rem;

            font-weight: 400;

            line-height: 1;

            user-select: none;
        }


        /* =========================================
           TRẠNG THÁI 已生效
        ========================================= */

        .status-active {

            color: #a7e8c3;

            font-size: 1.85rem;

            font-weight: 500;

            line-height: 1;

            margin-top: 0;

            margin-bottom: 12px;

            animation: breath 2.5s infinite ease-in-out;
        }


        /* =========================================
           TIMER

           00:00
           18:20
           59:59

           sau 1 giờ:

           1:00:00
           1:18:20

           hết 12 giờ:

           00:00
        ========================================= */

        #timer-up {

            color: #20c463;

            font-size: 2rem;

            font-weight: 600;

            line-height: 1;

            margin-top: 0;
        }


        /* =========================================
           HIỆU ỨNG 已生效
        ========================================= */

        @keyframes breath {

            0%,
            100% {
                opacity: 0.70;
            }

            50% {
                opacity: 1;
            }
        }


        /* =========================================
           CHỮ PHÍA DƯỚI
        ========================================= */

        .footer-note {

            margin:
                45px
                40px
                30px;

            font-size: 1.05rem;

            line-height: 1.9;

            color: #e0c9a6;

            text-align: left;

            text-shadow:
                1px 1px 4px rgba(0,0,0,1);

            opacity: 0.95;
        }


        /* =========================================
           ĐIỆN THOẠI NHỎ
        ========================================= */

        @media (max-width: 600px) {

            .container {

                padding-top: 55px;
            }


            .user-info {

                font-size: 1.20rem;

                margin-bottom: 40px;
            }


            .qr-card {

                margin:
                    0 15px;

                border-radius: 13px;
            }


            .qr-header {

                min-height: 110px;

                padding:
                    35px 12px;

                font-size: 1.05rem;
            }


            .notch {

                top: 99px;

                width: 22px;
                height: 22px;
            }


            .qr-body {

                padding:
                    25px
                    15px
                    32px;
            }


            #current-time {

                font-size: 1.20rem;

                margin-bottom: 16px;
            }


            .qr-image-container {

                width: 88%;
            }


            .refresh-text {

                font-size: 1.05rem;

                margin-top: 22px;
            }


            .status-active {

                font-size: 1.70rem;

                margin-bottom: 12px;
            }


            #timer-up {

                font-size: 1.85rem;
            }


            .footer-note {

                margin:
                    42px
                    30px
                    30px;

                font-size: 0.98rem;

                line-height: 1.9;
            }
        }


        /* =========================================
           IPHONE RẤT NHỎ
        ========================================= */

        @media (max-width: 390px) {

            .container {

                padding-top: 45px;
            }


            .user-info {

                font-size: 1.05rem;

                margin-bottom: 32px;
            }


            .qr-header {

                font-size: 0.95rem;

                min-height: 100px;
            }


            .notch {

                top: 89px;
            }


            #current-time {

                font-size: 1.05rem;
            }


            .qr-image-container {

                width: 90%;
            }


            .refresh-text {

                font-size: 1rem;
            }


            .status-active {

                font-size: 1.55rem;
            }


            #timer-up {

                font-size: 1.70rem;
            }


            .footer-note {

                margin-left: 25px;
                margin-right: 25px;

                font-size: 0.92rem;
            }
        }

    </style>

</head>


<body>


    <!-- =========================================
         LỚP TỐI
    ========================================== -->

    <div class="overlay"></div>


    <!-- =========================================
         KHUNG CHÍNH
    ========================================== -->

    <div class="container">


        <!-- TÊN -->

        <div class="user-info">
            V25102128(Mong Tien Nhieu)
        </div>


        <!-- =====================================
             THẺ QR
        ====================================== -->

        <div class="qr-card">


            <!-- PHẦN VÀNG -->

            <div class="qr-header">

                将二维码对准扫描器刷码出场

            </div>


            <!-- LỖ TRÒN -->

            <div class="notch notch-left"></div>

            <div class="notch notch-right"></div>


            <!-- =================================
                 PHẦN TRẮNG
            ================================== -->

            <div class="qr-body">


                <!-- THỜI GIAN THỰC -->

                <div id="current-time"></div>


                <!-- QR -->

                <div class="qr-image-container">

                    <img
                        src="./ewm.gif"
                        class="ewm"
                        alt="QR Code"
                        onerror="this.src='https://api.qrserver.com/v1/create-qr-code/?size=600x600&data=KaelenNguyen';"
                    >

                </div>


                <!-- REFRESH -->

                <span class="refresh-text">
                    刷新二维码
                </span>


                <!-- TRẠNG THÁI -->

                <div class="status-active">
                    已生效
                </div>


                <!-- TIMER -->

                <div id="timer-up">
                    00:00
                </div>


            </div>

        </div>


        <!-- =====================================
             CHỮ PHÍA DƯỚI
        ====================================== -->

        <div class="footer-note">

            尊敬的员工您好，您已进入企业涉密区域，出于企业安全考虑，您的手机摄像头将被禁止拍摄，感谢您的配合。

        </div>


    </div>



    <script>


        /* =========================================
           ĐỒNG HỒ HIỆN TẠI
           
           Ví dụ:

           2026-9-4 12:40:05
        ========================================= */

        function updateClock() {

            const now = new Date();


            const year =
                now.getFullYear();


            const month =
                now.getMonth() + 1;


            const day =
                now.getDate();


            const hours =
                String(now.getHours())
                .padStart(2, "0");


            const minutes =
                String(now.getMinutes())
                .padStart(2, "0");


            const seconds =
                String(now.getSeconds())
                .padStart(2, "0");


            const timeString =
                `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;


            document.getElementById(
                "current-time"
            ).textContent = timeString;
        }



        /* =========================================
           TIMER

           BẮT ĐẦU:

           00:00

           CHƯA ĐỦ 1 GIỜ:

           00:01
           00:59
           18:20
           59:59

           TỪ 1 GIỜ:

           1:00:00
           1:18:20
           2:05:30
           ...
           11:59:59

           SAU 12 GIỜ:

           00:00

           RỒI CHẠY LẠI
        ========================================= */


        /*
           Thời điểm bắt đầu timer.

           KHÔNG dùng localStorage.

           Vì vậy mỗi lần tải lại trang
           timer sẽ bắt đầu từ 00:00.
        */

        let startTime = Date.now();



        function updateTimer() {


            /* Thời gian hiện tại */

            const now =
                Date.now();


            /*
               Số giây đã chạy
            */

            let elapsed =
                Math.floor(
                    (now - startTime) / 1000
                );


            /*
               ==================================
               12 GIỜ = 43.200 GIÂY
               ==================================
            */

            const twelveHours =
                12 * 60 * 60;


            /*
               Nếu chạy đủ 12 giờ
               → reset
            */

            if (elapsed >= twelveHours) {

                startTime =
                    Date.now();

                elapsed = 0;
            }


            /*
               ==================================
               TÍNH GIỜ
               ==================================
            */

            const hours =
                Math.floor(
                    elapsed / 3600
                );


            /*
               ==================================
               TÍNH PHÚT
               ==================================
            */

            const minutes =
                Math.floor(
                    (elapsed % 3600) / 60
                );


            /*
               ==================================
               TÍNH GIÂY
               ==================================
            */

            const seconds =
                elapsed % 60;


            let display;



            /*
               ==================================
               CHƯA ĐỦ 1 GIỜ

               HIỆN:

               00:00
               00:01
               18:20
               59:59
               ==================================
            */

            if (hours === 0) {

                display =
                    String(minutes)
                    .padStart(2, "0")
                    +
                    ":"
                    +
                    String(seconds)
                    .padStart(2, "0");
            }


            /*
               ==================================
               TỪ 1 GIỜ TRỞ LÊN

               HIỆN:

               1:00:00
               1:18:20
               2:05:30
               ...
               11:59:59
               ==================================
            */

            else {

                display =
                    String(hours)
                    +
                    ":"
                    +
                    String(minutes)
                    .padStart(2, "0")
                    +
                    ":"
                    +
                    String(seconds)
                    .padStart(2, "0");
            }


            /*
               ==================================
               ĐƯA TIMER LÊN MÀN HÌNH
               ==================================
            */

            document.getElementById(
                "timer-up"
            ).textContent = display;

        }



        /* =========================================
           KHỞI ĐỘNG
        ========================================= */

        updateClock();

        updateTimer();


        /*
           Đồng hồ cập nhật mỗi 1 giây
        */

        setInterval(
            updateClock,
            1000
        );


        /*
           Timer cập nhật mỗi 1 giây
        */

        setInterval(
            updateTimer,
            1000
        );


    </script>


</body>

</html>
